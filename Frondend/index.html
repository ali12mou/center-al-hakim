  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#193964" />
    <meta name="description" content="AL-HAKIM CENTER à Djibouti : découvrez nos programmes de langues, management, informatique, comptabilité et finance. Apprenez aujourd’hui, préparez demain." />
    <link rel="icon" type="image/svg+xml" href="/faviconn.svg" />
    <link rel="preload" as="image" href="/Untitled-2.png" />
    <!-- Logo affiché pendant le téléchargement du JavaScript (réseau lent). -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2001;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 26px;
        background: radial-gradient(circle at 50% 42%, #fff 0 40%, #f8f7f3 100%);
      }
      #boot-splash svg {
        width: 110px;
        height: auto;
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      #boot-splash span {
        width: 140px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: #e6e8ec;
      }
      #boot-splash span::after {
        content: "";
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #193964, #d71850);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        50% {
          transform: scale(1.06);
          opacity: 0.85;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%) scaleX(0.4);
        }
        to {
          transform: translateX(100%) scaleX(0.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg,
        #boot-splash span::after {
          animation: none;
        }
      }
    </style>
    <title>AL-HAKIM CENTER — Apprenez aujourd’hui. Allez plus loin demain.</title>
    <!-- Google tag (gtag.js) : mesure d’audience Google Analytics G-DDH98S5HEG -->

  </head>
